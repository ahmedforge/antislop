services:
  backend:
    build: ./backend
    environment:
      APP_NAME: ${APP_NAME:-AntiSlop API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://antislop:antislop_dev@postgres:5432/antislop
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_INSTALL_CAPACITY: ${RATE_LIMIT_INSTALL_CAPACITY:-5}
      RATE_LIMIT_INSTALL_REFILL_SECONDS: ${RATE_LIMIT_INSTALL_REFILL_SECONDS:-60}
      RATE_LIMIT_IP_CAPACITY: ${RATE_LIMIT_IP_CAPACITY:-20}
      RATE_LIMIT_IP_REFILL_SECONDS: ${RATE_LIMIT_IP_REFILL_SECONDS:-10}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antislop
      POSTGRES_PASSWORD: antislop_dev
      POSTGRES_DB: antislop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antislop -d antislop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
