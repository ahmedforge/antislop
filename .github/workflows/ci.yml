name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
      ENVIRONMENT: test
      ADMIN_API_KEY: ""
      TEST_DATABASE_URL: postgresql+psycopg://antislop:antislop_test@127.0.0.1:5432/antislop_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: antislop
          POSTGRES_PASSWORD: antislop_test
          POSTGRES_DB: antislop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antislop -d antislop_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint backend, migrations, and tests
        run: python -m ruff check .
      - name: Type check application
        run: python -m mypy
      - name: Test with PostgreSQL, Redis, and coverage gate
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml -q

  extension:
    name: Extension checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check and build extension
        run: npm run build
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test extension in Chromium
        run: npm test
